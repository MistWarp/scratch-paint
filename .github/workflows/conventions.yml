name: Conventions

on: pull_request

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: node scripts/check-conventions.mjs --base=origin/${{ github.base_ref }}
